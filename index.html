<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Hasil Ujian - MTs Khairussa'adah Kubu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 50%, #10b981 100%);
            background-attachment: fixed;
            color: #1e293b; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            padding: 1.5rem 1rem;
        }
        header { 
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            padding: 1.5rem 2rem; 
            border-radius: 1.25rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto 2rem auto;
            text-align: center;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.15);
        }
        header h1 { color: #4f46e5; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.25rem; }
        header p { color: #64748b; font-size: 0.85rem; font-weight: 600; }

        main { 
            flex-grow: 1; 
            max-width: 900px; 
            width: 100%; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem; 
            padding: 2rem; 
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-size: 1.2rem; font-weight: 800; color: #1e293b; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        p.desc { font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem; }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        @media(max-width: 600px) { .filter-grid { grid-template-columns: 1fr; } }

        label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 0.4rem; }
        select { 
            width: 100%; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 0.75rem; 
            padding: 0.75rem 1rem; 
            font-size: 0.9rem; 
            font-weight: 600;
            color: #1e293b; 
            outline: none; 
            transition: all 0.3s;
            cursor: pointer;
        }
        select:focus { border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        /* Tabel Peringkat Kelas */
        .table-container { max-height: 450px; overflow-y: auto; border-radius: 1rem; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th { background: #f8fafc; color: #475569; padding: 1rem; font-weight: 800; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
        td { padding: 0.9rem 1rem; border-bottom: 1px solid #f1f5f9; font-weight: 600; color: #334155; }
        tr:hover { background: #f8fafc; }
