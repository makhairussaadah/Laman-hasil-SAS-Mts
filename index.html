<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Hasil Ujian - MTs Khairussa'adah Kubu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 50%, #10b981 100%);
            background-attachment: fixed;
            color: #1e293b; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            padding: 1.5rem 1rem;
        }
        header { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            padding: 1.5rem 2rem; 
            border-radius: 1.25rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto 2rem auto;
            text-align: center;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.15);
        }
        header h1 { color: #4f46e5; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.25rem; }
        header p { color: #64748b; font-size: 0.85rem; font-weight: 600; }

        main { 
            flex-grow: 1; 
            max-width: 900px; 
            width: 100%; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem; 
            padding: 2rem; 
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
        }

        h2 { font-size: 1.2rem; font-weight: 800; color: #1e293b; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        p.desc { font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem; }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        @media(max-width: 600px) { .filter-grid { grid-template-columns: 1fr; } }

        label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 0.4rem; }
        select { 
            width: 100%; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 0.75rem; 
            padding: 0.75rem 1rem; 
            font-size: 0.9rem; 
            font-weight: 600;
            color: #1e293b; 
            outline: none; 
            cursor: pointer;
        }
        select:focus { border-color: #4f46e5; background: #fff; }

        .table-container { max-height: 450px; overflow-y: auto; border-radius: 1rem; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th { background: #f8fafc; color: #475569; padding: 1rem; font-weight: 800; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
        td { padding: 0.9rem 1rem; border-bottom: 1px solid #f1f5f9; font-weight: 600; color: #334155; }
        tr:hover { background: #f8fafc; }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #475569;
            font-weight: 800;
            font-size: 0.8rem;
        }
        tr:nth-child(1) .rank-badge { background: #fef08a; color: #854d0e; }
        tr:nth-child(2) .rank-badge { background: #e2e8f0; color: #334155; }
        tr:nth-child(3) .rank-badge { background: #ffedd5; color: #9a3412; }

        .score-good { background: #d1fae5; color: #065f46; padding: 0.3rem 0.8rem; border-radius: 2rem; font-weight: 800; font-size: 0.85rem; }
        .score-bad { background: #fee2e2; color: #991b1b; padding: 0.3rem 0.8rem; border-radius: 2rem; font-weight: 800; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>✨ Portal Hasil Ujian MTs Khairussa'adah</h1>
        <p>Pilih mata pelajaran dan kelas untuk melihat peringkat rekapitulasi nilai siswa</p>
    </header>

    <main>
        <div class="card">
            <h2>Peringkat & Rekapitulasi Nilai Per Kelas</h2>
            
            <div class="filter-grid">
                <div>
                    <label>Pilih Mata Pelajaran:</label>
                    <select id="selectMapel" onchange="renderLeaderboard()">
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Arab">Bahasa Arab</option>
                        <option value="Muatan Lokal">Muatan Lokal</option>
                        <option value="SKI">SKI</option>
                        <option value="Fikih">Fikih</option>
                        <option value="Akidah Akhlak">Akidah Akhlak</option>
                        <option value="Qur'an Hadist">Qur'an Hadist</option>
                        <option value="Sosiologi">Sosiologi</option>
                        <option value="PKN">PKN</option>
                        <option value="IPS">IPS</option>
                        <option value="IPA">IPA</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Informatika">Informatika</option>
                        <option value="Seni Budaya">Seni Budaya</option>
                        <option value="PJOK">PJOK</option>
                    </select>
                </div>
                <div>
                    <label>Pilih Kelas:</label>
                    <select id="selectKelas" onchange="renderLeaderboard()">
                        <option value="VII">Kelas VII (Tujuh)</option>
                        <option value="VIII">Kelas VIII (Delapan)</option>
                        <option value="IX">Kelas IX (Sembilan)</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 70px; text-align: center;">Rank</th>
                            <th>No. Ujian</th>
                            <th>Nama Siswa</th>
                            <th>Ruang</th>
                            <th style="text-align: right;">Nilai Akhir</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 2rem;">Sedang memuat data dari Google Sheets...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Masukkan URL Web App Google Apps Script Anda di sini
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwyyrcgXp58uAaavWagcovm3cBGlzvYP1S3cR4ctdT8bGSREGNkwts0d-06dbbLhQ6GJg/exec";

        let sheetData = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchDataFromSheets();
        });

        async function fetchDataFromSheets() {
            if(!GAS_URL || GAS_URL.includes("MASUKKAN_URL")) {
                document.getElementById('leaderboardBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 2rem;">URL Web App Google Apps Script belum dikonfigurasi di dalam kode.</td></tr>`;
                return;
            }

            try {
                let response = await fetch(GAS_URL);
                sheetData = await response.json();
                renderLeaderboard();
            } catch (err) {
                console.error("Gagal mengambil data:", err);
                document.getElementById('leaderboardBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 2rem;">Gagal terhubung ke Google Sheets.</td></tr>`;
            }
        }

        function renderLeaderboard() {
            const selectedMapel = document.getElementById('selectMapel').value;
            const selectedKelas = document.getElementById('selectKelas').value;
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            // Filter data dari Google Sheets berdasarkan kelas dan mapel
            let filtered = sheetData.filter(item => item.kelas === selectedKelas && item.mapel === selectedMapel);

            // Urutkan (Sorting) dari nilai tertinggi ke terendah
            filtered.sort((a, b) => Number(b.nilai) - Number(a.nilai));

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 2rem;">Belum ada rekap nilai untuk kelas dan mapel ini di Google Sheets.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                let score = Number(item.nilai);
                let scoreClass = score < 75 ? 'score-bad' : 'score-good';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;"><span class="rank-badge">${index + 1}</span></td>
                    <td style="font-family: monospace; color: #4f46e5; font-weight: 700;">${item.noUjian}</td>
                    <td style="font-weight: 700; color: #1e293b;">${item.nama}</td>
                    <td><span style="background: #f1f5f9; padding: 0.2rem 0.6rem; border-radius: 0.4rem; font-size: 0.8rem; color: #475569;">${item.ruang || '-'}</span></td>
                    <td style="text-align: right;"><span class="${scoreClass}">${score}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
